name: ummu_ayman
description: Ummu Ayman Outfits - daftari la duka (PIN, Nyumbani, Mauzo ya leo, Stock, Risiti, Ripoti).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: '>=0.19.0 <0.21.0'
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.13.1
  flutter_svg: ^2.0.10
  # Firebase Cloud Messaging - washa ukiongeza google-services.json yako
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Font ya Inter iko ndani ya app (haihitaji intaneti)
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

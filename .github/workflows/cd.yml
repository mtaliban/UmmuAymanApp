name: CD — Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare release info
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          DATE=$(TZ=Africa/Dar_es_Salaam date '+%Y%m%d-%H%M')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "DATE=${DATE}"       >> $GITHUB_ENV
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk   ummu-ayman-arm64.apk
          mv app-armeabi-v7a-release.apk ummu-ayman-arm32.apk

      # Tag ni "latest" daima: kila push inabadilisha release ile ile,
      # badala ya kutengeneza release mpya yenye tarehe.
      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Ummu Ayman — Toleo la Sasa"
          make_latest: true
          overwrite_files: true
          body: |
            ## Pakua hapa chini

            Release hii inabadilishwa kila push — link ni ile ile daima.

            | Faili | Ukubwa | Simu |
            |-------|--------|------|
            | `ummu-ayman-arm64.apk` | ~23 MB | Simu za kisasa (Samsung/Tecno/Infinix 2016+) — **chaguo la kwanza** |
            | `ummu-ayman-arm32.apk` | ~21 MB | Simu za zamani (32-bit) — kama arm64 haitanyi kazi |

            ---

            > Sijui APK ipi? Chagua **arm64** kwanza. Kama haitaki, jaribu **arm32**.
            > Inakataa install? Settings → Security → **Install unknown apps** — wezasha

            ---

            🕒 Ilitegenezwa: `${{ env.DATE }}`
            🔗 Commit: `${{ github.sha }}`
          files: |
            build/app/outputs/flutter-apk/ummu-ayman-arm64.apk
            build/app/outputs/flutter-apk/ummu-ayman-arm32.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ondoa release za zamani zenye tag ya tarehe ili zisichanganye.
      - name: Futa matoleo ya zamani
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r tag; do
            if [ -n "${tag}" ] && [ "${tag}" != "latest" ]; then
              gh release delete "${tag}" --yes --cleanup-tag || true
            fi
          done

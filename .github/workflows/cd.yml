name: CD — Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr '+' '-')
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/ummu-ayman-v${VERSION}.apk
          echo "APK_NAME=ummu-ayman-v${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Delete old latest release
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Ummu Ayman — Toleo la Hivi Karibuni"
          prerelease: true
          body: |
            **Toleo jipya limebuildiwa kiotomatiki.**

            ### Jinsi ya Kuinstall (Android)
            1. Bonyeza `.apk` hapa chini uipakue
            2. Fungua simu → Settings → Security → **Install unknown apps** → washa
            3. Fungua APK uliyopakua → **Install**
            4. Tayari — fungua Ummu Ayman

            > Version: ${{ env.VERSION }}
            > Built: ${{ github.run_number }} (${{ github.sha }})
          files: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

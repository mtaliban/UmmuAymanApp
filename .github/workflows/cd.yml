name: CD — Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Prepare release info
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          DATE=$(TZ=Africa/Dar_es_Salaam date '+%Y%m%d-%H%M')
          TAG="v${VERSION}-${DATE}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "DATE=${DATE}"       >> $GITHUB_ENV
          echo "TAG=${TAG}"         >> $GITHUB_ENV
          cd build/app/outputs/flutter-apk/
          mv app-release.apk             ummu-ayman-kamili-v${VERSION}-${DATE}.apk
          mv app-arm64-v8a-release.apk   ummu-ayman-arm64-v${VERSION}-${DATE}.apk
          mv app-armeabi-v7a-release.apk ummu-ayman-arm32-v${VERSION}-${DATE}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Ummu Ayman — Toleo Jipya"
          make_latest: true
          body: |
            ## Pakua hapa chini

            **Kwa Simu — APK ya moja kwa moja**

            | Faili | Ukubwa | Simu |
            |-------|--------|------|
            | `ummu-ayman-kamili-*` | ~25 MB | **APK kamili — simu yoyote.** Chaguo la kwanza; inafanya kazi kwenye 64-bit na 32-bit |
            | `ummu-ayman-arm64-*` | ~24 MB | Simu za kisasa (64-bit) — nyepesi kidogo |
            | `ummu-ayman-arm32-*` | ~22 MB | Simu za zamani (32-bit) |

            ---

            > Sijui APK ipi? Chagua **kamili** — inafanya kazi kwenye simu yoyote.
            > Inakataa install? Settings → Security → **Install unknown apps** — wezasha

            ---

            🕒 Ilitegenezwa: `${{ env.DATE }}`
            🔗 Commit: `${{ github.sha }}`
          files: |
            build/app/outputs/flutter-apk/ummu-ayman-kamili-v${{ env.VERSION }}-${{ env.DATE }}.apk
            build/app/outputs/flutter-apk/ummu-ayman-arm64-v${{ env.VERSION }}-${{ env.DATE }}.apk
            build/app/outputs/flutter-apk/ummu-ayman-arm32-v${{ env.VERSION }}-${{ env.DATE }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

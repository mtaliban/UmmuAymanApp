name: CD — Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr '+' '-')
          TAG="v${VERSION}-build${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk   ummu-ayman-${TAG}-arm64.apk
          mv app-armeabi-v7a-release.apk ummu-ayman-${TAG}-arm32.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Ummu Ayman ${{ env.TAG }}"
          make_latest: true
          body: |
            ## Ummu Ayman Outfits
            **Version:** ${{ env.VERSION }} &nbsp;|&nbsp; **Build:** #${{ github.run_number }}

            ---

            ### Pakua APK

            | Faili | Simu |
            |-------|------|
            | **`arm64`** ✅ | Simu zote za kisasa (Samsung, Tecno, Infinix, nk) |
            | `arm32` | Simu za zamani sana (kabla ya 2015) |

            ---

            ### Jinsi ya Kuinstall
            1. Bonyeza faili la `arm64` hapa chini — ipakuliwe
            2. Fungua simu → **Settings → Security → Install unknown apps** → washa
            3. Fungua APK → **Install**
          files: |
            build/app/outputs/flutter-apk/ummu-ayman-${{ env.TAG }}-arm64.apk
            build/app/outputs/flutter-apk/ummu-ayman-${{ env.TAG }}-arm32.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CD — Build & Release APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tengeneza GitHub Release?'
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/ummu-ayman-release.jks

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          flutter build apk --release \
            --dart-define=ENV=production

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr '+' '-')
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/ummu-ayman-v${VERSION}.apk
          echo "APK_NAME=ummu-ayman-v${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ummu Ayman ${{ github.ref_name }}
          body: |
            ## Ummu Ayman Outfits — ${{ github.ref_name }}

            ### Vilivyobadilika
            Angalia [commit history](https://github.com/${{ github.repository }}/commits/main) kwa maelezo.

            ### Jinsi ya Kuinstall (Android)
            1. Pakua faili la `.apk` hapa chini
            2. Fungua simu yako → Settings → Security → Allow unknown sources
            3. Fungua APK uliyo-download → Install

            > **iPhone:** Huhitaji APK — omba msaada kwa mtu wa kiufundi.
          files: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          draft: false
          prerelease: false

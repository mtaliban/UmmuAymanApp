name: CD — Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APKs (split per ABI — ndogo zaidi)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr '+' '-')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk   ummu-ayman-v${VERSION}-arm64.apk
          mv app-armeabi-v7a-release.apk ummu-ayman-v${VERSION}-arm32.apk
          mv app-x86_64-release.apk      ummu-ayman-v${VERSION}-x86.apk

      - name: Delete old latest release
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Ummu Ayman — Toleo Jipya"
          prerelease: false
          body: |
            ## Ummu Ayman Outfits 🛍️
            **Version:** ${{ env.VERSION }} &nbsp;|&nbsp; **Build:** #${{ github.run_number }}

            ---

            ### 📲 Pakua APK — Chagua moja tu

            | Faili | Simu | Ukubwa |
            |-------|------|--------|
            | **`arm64`** ✅ | Simu zote za kisasa (2016+) | ~10 MB |
            | `arm32` | Simu za zamani sana | ~9 MB |
            | `x86` | Emulator/PC tu | ~10 MB |

            > **Shaka?** Chagua `arm64` — inafanya kazi simu nyingi.

            ---

            ### ⚙️ Jinsi ya Kuinstall
            1. Bonyeza faili la `arm64` hapa chini — ipakuliwe
            2. Fungua simu → **Settings → Security → Install unknown apps** → washa
            3. Fungua APK → **Install**
            4. Tayari ✅
          files: |
            build/app/outputs/flutter-apk/ummu-ayman-v${{ env.VERSION }}-arm64.apk
            build/app/outputs/flutter-apk/ummu-ayman-v${{ env.VERSION }}-arm32.apk
            build/app/outputs/flutter-apk/ummu-ayman-v${{ env.VERSION }}-x86.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
